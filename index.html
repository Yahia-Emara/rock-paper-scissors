<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" type="module"></script>
</head>
<body>
    <div class="header">
        Rock Paper Scissors
    </div>
    <div class="game-card">
        <div class="players">
            <div class="user-card">
                <ul class="scores">
                    <li class="score-dot"></li>
                    <li class="score-dot"></li>
                    <li class="score-dot"></li>
                    <li class="score-dot"></li>
                    <li class="score-dot"></li>
                </ul>
                <div class="move-card"></div>
            </div>
            <div class="bot-card">
                <div class="scores">
                    <div class="score-dot"></div>
                    <div class="score-dot"></div>
                    <div class="score-dot"></div>
                    <div class="score-dot"></div>
                    <div class="score-dot"></div>
                </div>
                <div class="move-card"></div>
            </div>
        </div>
        <div class="play-buttons">
            <button>✊ Rock</button>
            <button>✋ Paper</button>
            <button>✌️ Scissors</button>
        </div>
    </div>
</body>
</html>
